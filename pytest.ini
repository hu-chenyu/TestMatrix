[pytest]
# ==============================================================================
# TestMatrix pytest核心配置
# 用例规则 / 标记 / 插件 / 报告路径 统一在此定义
# ==============================================================================

# ------------------------------ 用例发现规则 ------------------------------
# 仅识别 tests/ 目录下的用例文件，避免误收集 src/ 业务代码
testpaths = tests
# 将项目根目录加入sys.path，保证 tests/ 用例可 import src 包
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ------------------------------ 用例标记注册 ------------------------------
# smoke       冒烟用例（核心链路，每次构建必跑）
# regression  回归用例（全量回归）
# api         HTTP接口自动化用例
# slow        执行耗时较长的用例
markers =
    smoke: 冒烟测试用例，核心链路验证
    regression: 回归测试用例，全量功能回归
    api: HTTP接口自动化测试
    slow: 耗时较长的用例

# ------------------------------ 执行策略 ------------------------------
# 失败用例**不自动重跑**。原先是 reruns=2 + reruns_delay=1：
# 它并没有"治理"flaky，只是把它藏起来——任一用例首败、重跑通过，pytest 照样
# 报 PASSED、CI 照样全绿，时序类偶发失败对门禁完全不可见。
# 项目铁律是"测试只增不减、禁 flaky"，正确的做法是把偶发失败暴露出来修掉，
# 而不是给它两次免费机会。flaky 的检测/标注/隔离另有专项排期
# （Flaky 治理专项），届时按治理方案再引入重跑。
reruns = 0
# 严格模式：未注册标记直接报错，防止标记拼写错误
# Windows 注意：--clean-alluredir 遇历史残留/目录占用可能 INTERNALERROR（WinError 145），
# 先手动删除 output/allure_results 目录后再重跑 pytest（CI 全新检出不受影响）
addopts =
    -v
    --strict-markers
    --alluredir=output/allure_results
    --clean-alluredir
# 控制递归搜索深度，提升用例收集性能
norecursedirs = output docs examples docker .git .idea .vscode venv

# ------------------------------ 日志配置 ------------------------------
# pytest捕获的日志格式（与Loguru格式保持统一风格）
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(message)s
log_format = %(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(message)s
