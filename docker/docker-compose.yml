# ==============================================================================
# TestMatrix 一键编排启动配置
# 使用方式（在项目根目录执行）:
#   启动测试执行容器:       docker compose -f docker/docker-compose.yml up test-runner
#   启动MySQL模式联调:      docker compose -f docker/docker-compose.yml --profile mysql up -d
#     （MySQL模式下需设置环境变量 TM_DB_TYPE=mysql 再启动test-runner）
# ==============================================================================

services:
  # ------------------------------ 测试执行器 ------------------------------
  # 容器内运行pytest测试套件，测试产物挂载到宿主机output/目录
  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: testmatrix:latest
    container_name: testmatrix-runner
    environment:
      # 运行环境与日志级别
      TM_ENV: test
      TM_LOG_LEVEL: INFO
      # 数据库模式: sqlite（默认本地文件）/ mysql（配合mysql服务联调）
      TM_DB_TYPE: ${TM_DB_TYPE:-sqlite}
      # MySQL连接配置（仅TM_DB_TYPE=mysql时生效）
      TM_DB_MYSQL_HOST: mysql
      TM_DB_MYSQL_PORT: "3306"
      TM_DB_MYSQL_USER: ${TM_DB_MYSQL_USER:-testmatrix}
      # 口令不在此处声明（Day44 P2-01）。原先写的是
      #   TM_DB_MYSQL_PASSWORD: ${TM_DB_MYSQL_PASSWORD:?必须在 .env 设置 ...}
      # 但 compose 的 ${VAR:?} 是**无条件求值**的——TM_DB_TYPE 默认 sqlite、
      # 本服务根本不会用到 MySQL，新克隆仓库执行 README 的开箱命令
      # `docker compose ... up test-runner` 仍会在解析阶段直接报错退出。
      # 口径：sqlite 路径零配置可跑；MySQL 口令只由下方 mysql 服务
      # （--profile mysql 才启用）强制要求，该处的守卫才是恰当位置。
      TM_DB_MYSQL_DATABASE: ${TM_DB_MYSQL_DATABASE:-testmatrix}
    volumes:
      # 测试产物（日志/Allure结果）挂载宿主机，便于本机查看报告
      - ../output:/app/output

  # ------------------------------ MySQL数据库 ------------------------------
  # 默认不启动，追加 --profile mysql 启用，用于MySQL模式联调验证
  mysql:
    image: mysql:8.0
    container_name: testmatrix-mysql
    profiles: ["mysql"]
    environment:
      # root 与用户口令均强制显式配置，无明文默认值（Day43 收尾 D4）。
      # ${VAR:?msg} 语法：VAR 未设置时 compose 立即报错并打印 msg，
      # 避免"照抄默认口令起环境"这种弱口令进共享/生产网络的路径。
      MYSQL_ROOT_PASSWORD: ${TM_DB_MYSQL_ROOT_PASSWORD:?必须在 .env 设置 TM_DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TM_DB_MYSQL_DATABASE:-testmatrix}
      MYSQL_USER: ${TM_DB_MYSQL_USER:-testmatrix}
      MYSQL_PASSWORD: ${TM_DB_MYSQL_PASSWORD:?必须在 .env 设置 TM_DB_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环（Day44 P2-02）：平台无鉴权，MySQL 端口对外暴露等于把
      # 一个弱口令可爆破的数据库直接挂到公网。需要从别的机器连时，
      # 显式改成 "0.0.0.0:3306:3306" 并自行承担风险。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
