# ==============================================================================
# TestMatrix 主 CI 工作流（Day38 新增）
# 设计要点：
# 1. Python 3.11 为主版本必须全绿；3.12 为探测版本（experimental 矩阵位），
#    用【job 级】continue-on-error 保证整体不阻断流水线，但步骤级不套
#    continue-on-error——失败步骤如实显示红叉并产生 annotation，
#    末尾"探测版本结果汇总"步骤把失败项汇总成 ::warning::，信号不丢失
# 2. 步骤顺序：依赖安装 → ruff 全量强制（src+tests+scripts，不 ignore 规则）
#    → mypy 增量（仅阻断本次 diff 新增行上的类型错误，未改动行存量豁免）
#    → mypy 全量基线（豁免不阻断，::warning:: 给稳定趋势数）
#    → pytest 全量（含覆盖率门禁 --cov-fail-under=85，测试数以实际运行为准不硬编码）→ pip-audit 完整报告 + 分级门禁 → 探测版本结果汇总
# 3. pip-audit 门禁：HIGH/CRITICAL（含严重级未知，fail-closed）且不在
#    .pip-audit-allowlist.txt（必须带未过期的过期日，缺日/过期均按未豁免处理）内
#    才阻断；MODERATE/LOW 仅告警
# 4. 已接入覆盖率门禁（pytest 步骤 --cov=src --cov-fail-under=85，Day40 由 80 收紧；
#    零收集 exit 5 不设容忍）、不含 Docker/部署步骤、不含失败通知（均为后期阶段）
# 5. mypy strict 双层策略（Day40-fix 加固）：增量步骤硬阻断"本次新增行"上的类型错误
#    （工具链崩溃/输出异常也判红，不假绿），未改动行存量错误随专项债豁免；全量基线
#    步骤只 ::warning:: 追踪总数（Day40 起 196 个）只减不增。strict=true 与禁 ignore 不变
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 测试数下限基线（Day44 P2-15）：只增不减，用于阻断"删测试换绿"。
# 新增测试后把该值调大到新的收集数；调小需在 PR 中说明等价覆盖理由。
env:
  TEST_COUNT_BASELINE: "1445"

jobs:
  test:
    name: Python ${{ matrix.python-version }}${{ matrix.experimental && '（探测版本，不阻断）' || '' }}
    # 钉死 ubuntu-24.04：GitHub 的 ubuntu 滚动 latest 标签将于 2026-10-19 迁到 26.04，
    # 首次全绿期避开 runner 镜像大版本迁移引入的不可控变量（Day40-fix）
    runs-on: ubuntu-24.04
    # job 级开关（非 strategy、非 step 级）：3.12 探测位 job 失败不把整条 workflow run 拖红；
    # 步骤不设 step 级 continue-on-error，失败步骤保留红叉与 annotation 真实信号。
    # 3.11 主版本 experimental=false，等价于关闭，任何一步失败照常阻断
    continue-on-error: ${{ matrix.experimental }}
    # 防止 CI 卡死（如网络挂起/测试死循环），15 分钟整体超时
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主版本：任何一步失败都阻断
          - python-version: "3.11"
            experimental: false
          # 探测版本：仅验证新版本兼容性，job 整体不阻断，但每个步骤成败如实展示
          - python-version: "3.12"
            experimental: true

    steps:
      - name: 检出代码（fetch-depth=0 拉完整历史，供 mypy 步骤 git diff）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装项目依赖与 CI 工具链（ruff/mypy/pip-audit 仅 CI 安装，不进 requirements.txt）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: ruff 全量静态检查（src + tests + scripts，规则不 ignore，存量问题清单化后按模块日修复）
        id: ruff-check
        run: ruff check src tests scripts

      - name: mypy 增量检查（仅阻断本次新增行上的类型错误；未改动行存量豁免）
        id: mypy-check
        shell: bash
        run: |
          # 工具链守卫：mypy 不存在时必须判红，绝不能读作"0 错误"假绿（修复2）
          command -v mypy >/dev/null || { echo "::error::mypy 未安装，工具链故障，阻断 CI"; exit 1; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # pull_request 事件 github.event.before 可能为空，用 origin/main 做兜底基线
            git fetch origin main:refs/remotes/origin/main || true
            BASE_SHA=origin/main
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          # fail-closed 守卫两分支共用，必须在算 CHANGED_SRC 之前校验 BASE 可达性：
          # PR 分支 fetch 失败导致 origin/main 缺失、push 分支 before 不可达（基线提交
          # 不在当前历史中）都会先尝试回退到 HEAD~1；仍不可达才判红。否则 git diff
          # 失败→CHANGED_SRC 空→误走"无 src 变更跳过"分支 exit0（假绿）。
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # 基线不可达（常见于主线整理后首个 run）：回退到当前 HEAD 的父提交，
            # 仍对"本次提交相对其父的新增行"硬阻断，不丢增量语义
            ORIGINAL_BASE="${BASE_SHA}"
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
            if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::原基线 ${ORIGINAL_BASE} 不可达，回退至 HEAD~1=${BASE_SHA} 作为增量基准"
            else
              echo "::error::基线 ${ORIGINAL_BASE} 与 HEAD~1 均不可达（root commit/历史异常），无法判定新增行类型错误，fail-closed 阻断"
              exit 1
            fi
          fi
          CHANGED_SRC=$(git diff --name-only "$BASE_SHA"...HEAD -- '*.py' | grep '^src/' || true)
          echo "本次变更的 src 文件：${CHANGED_SRC:-（无）}"
          if [ -z "$CHANGED_SRC" ]; then
            echo "无新增/修改 src 文件，跳过 mypy 增量检查"
          else
            # 本次 diff 的"新增行"集合（path:line）。只阻断落在新增行上的类型错误：
            # 未改动行上的存量缺注解错误随专项债豁免，避免一改文件就被全文件存量卡死。
            # BASE 可达性已在上方 cat-file 校验，此处 git diff 必成功，无需重复守卫。
            ADDED_LINES=$(git diff "$BASE_SHA"...HEAD --unified=0 -- $CHANGED_SRC | awk '
              /^\+\+\+ b\// { file=substr($0,7) }
              /^@@/ {
                if (match($0, /\+[0-9]+(,[0-9]+)?/)) {
                  hunk=substr($0, RSTART+1, RLENGTH-1); split(hunk, hp, ",")
                  start=hp[1]; cnt=(hp[2]==""?1:hp[2]); for (i=0;i<cnt;i++) print file ":" start+i
                }
              }')
            # GitHub bash 默认 set -e，mypy 有存量错误退出码非 0，需临时放开
            set +e
            mypy_output=$(mypy $CHANGED_SRC 2>&1)
            mypy_code=$?
            set -e
            echo "$mypy_output"
            # 路径分隔符归一化：Linux runner 输出正斜杠（tr 无副作用），与 git 新增行路径可比
            normalized=$(printf '%s\n' "$mypy_output" | tr '\\' '/')
            # follow-imports 全集错误数（含依赖文件存量债，仅 warning 追踪）
            # mypy 默认输出 path:line: error:（无列号），正则兼容带/不带列号两种格式
            err_count=$(printf '%s\n' "$normalized" | awk '/:[0-9]+(:[0-9]+)?: error:/{c++} END{print c+0}')
            # 新增行错误数：错误行（path:line）必须命中本次 diff 新增行集合（修复1 强制力核心）
            new_err_count=$(printf '%s\n' "$normalized" | awk -v added="$ADDED_LINES" '
              BEGIN{ n=split(added,a,"\n"); for(i=1;i<=n;i++) added_map[a[i]]=1 }
              /:[0-9]+(:[0-9]+)?: error:/ { split($0,p,":"); if ((p[1]":"p[2]) in added_map) hit++ }
              END{ print hit+0 }')
            # 崩溃守卫：非零退出码但零错误行=mypy 崩溃/输出格式异常，不能读作 0 错误（修复2）
            if [ "$mypy_code" -ne 0 ] && [ "$err_count" -eq 0 ]; then
              echo "::error::mypy 执行异常（退出码 ${mypy_code} 但错误行数为 0，疑似工具链崩溃或输出格式变化），阻断 CI"
              exit 1
            fi
            # 本次新增/修改行上出现 strict 错误=硬阻断，不享受存量豁免（修复1）
            if [ "$new_err_count" -gt 0 ]; then
              echo "::error::本次 diff 新增行上存在 ${new_err_count} 个 mypy 错误（strict 合规要求，新增代码不豁免，禁止 type: ignore）"
              exit 1
            fi
            echo "::warning::TestMatrix mypy follow 全集存量错误 ${err_count} 个（本次新增行 0，存量随专项债豁免只减不增）"
            echo "增量门槛：新增行错误=${new_err_count}（>0 阻断），follow 存量总错误=${err_count}（豁免），mypy 退出码=${mypy_code}"
          fi

      - name: mypy 全量基线（存量豁免，仅 warning 追踪趋势）
        id: mypy-baseline
        shell: bash
        run: |
          # 全量口径 mypy src：数字不随当次提交碰了哪些文件波动，作为跨 commit 趋势基线（修复3）
          command -v mypy >/dev/null || { echo "::error::mypy 未安装，工具链故障，阻断 CI"; exit 1; }
          set +e
          baseline_output=$(mypy src 2>&1)
          baseline_code=$?
          set -e
          echo "$baseline_output" | tail -3
          baseline_count=$(printf '%s\n' "$baseline_output" | awk '/:[0-9]+(:[0-9]+)?: error:/{c++} END{print c+0}')
          if [ "$baseline_code" -ne 0 ] && [ "$baseline_count" -eq 0 ]; then
            echo "::error::mypy 全量基线执行异常（退出码 ${baseline_code} 但错误数为 0，疑似工具链崩溃或输出格式变化），阻断 CI"
            exit 1
          fi
          echo "::warning::TestMatrix mypy 全量存量错误 ${baseline_count} 个（趋势基线，只减不增；增量步骤已硬阻断变更文件自身新增错误）"
          echo "全量基线错误数=${baseline_count}（豁免不阻断），mypy 退出码=${baseline_code}"

      - name: pytest 全量回归 + 覆盖率门禁（--cov-fail-under=85，测试数下限断言）
        id: pytest-run
        # 覆盖率不足/测试失败退出码 1 判红；退出码 5（无测试被收集）同样判红——
        # testpaths 固定为 tests/，0 收集只可能是配置/路径损坏，不设容忍以防静默通过
        run: |
          python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: 测试总数下限断言（防止"删测试换绿"）
        # Day44 P2-15。此前 CI 对"测试数以实际运行为准"、不做任何下限校验，
        # 意味着删除任意数量的测试，CI 依然全绿——项目用 44 天、上千条用例
        # 建起的回归护栏没有任何机器校验的下限，是"改代码→删掉不通过的测试"
        # 这条路径的天然缺口。
        # 口径：基线只增不减。本次实际收集数 < 基线即判红；新增用例不受限。
        # 维护约定：TEST_COUNT_BASELINE 只允许**调大**，且必须与新增测试同一个
        # 提交（调小需在 PR 中说明理由并给出等价覆盖）。
        run: |
          BASELINE="${{ env.TEST_COUNT_BASELINE }}"
          ACTUAL=$(python -m pytest -q --collect-only 2>/dev/null | tail -1 | grep -oE '[0-9]+' | head -1)
          echo "测试数基线: $BASELINE / 本次实际收集: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::无法解析实际收集到的用例数，门禁 fail-closed"
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASELINE" ]; then
            echo "::error::测试数从 $BASELINE 降至 $ACTUAL，违反『测试只增不减』铁律（差 $((BASELINE - ACTUAL)) 条）"
            exit 1
          fi
          echo "测试数下限断言通过（$ACTUAL >= $BASELINE）"

      - name: pip-audit 完整报告（仅展示用，是否阻断由下一步分级门禁裁定）
        # 显式 -r requirements.txt：审计项目依赖闭包，不把 ruff/mypy/pip-audit 工具链自身算进来
        run: pip-audit -r requirements.txt --desc --format columns
        # pip-audit 发现漏洞时退出码恒为 1（属于审计结果而非步骤故障），固定不阻断
        continue-on-error: true

      - name: pip-audit 分级门禁（未豁免 HIGH/CRITICAL 阻断，中低危仅告警）
        id: pip-audit-gate
        shell: bash
        run: |
          # 导出项目依赖闭包的 JSON 报告（有漏洞时退出码非 0，不影响本步继续）
          # 注意 pip-audit JSON 结构为 {"dependencies":[{"name","version","vulns":[...]}]}
          # 且 vulns 不含 severity 字段，严重级需下一步向 OSV 查询
          pip-audit -r requirements.txt --format json --aliases on --output /tmp/pip-audit.json || true
          python - <<'PY'
          """pip-audit 分级门禁：解析真实 JSON schema，包级豁免 + OSV 严重级查询 + fail-closed。"""
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.error
          import urllib.request

          AUDIT_JSON = pathlib.Path("/tmp/pip-audit.json")
          ALLOW_LIST = pathlib.Path(".pip-audit-allowlist.txt")
          # TM_OSV_BASE 仅供离线测试覆盖，生产固定走官方 OSV API
          OSV_BASE = os.environ.get("TM_OSV_BASE", "https://api.osv.dev").rstrip("/")
          # 无法定级（UNKNOWN）按 fail-closed 与高危同处理，倒逼人工升级或写豁免
          BLOCK_LEVELS = {"CRITICAL", "HIGH", "UNKNOWN"}

          def parse_allowlist(path):
              """解析豁免清单，返回 {(包名小写, 版本): (过期日字符串或None, 原始行号)}。

              保留行号用于缺过期日 fail-closed 时精确定位清单条目。
              """
              exempt = {}
              if not path.exists():
                  return exempt
              for line_no, raw_line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  line = raw_line.strip()
                  if not line or line.startswith("#") or "==" not in line:
                      continue
                  spec, _, comment = line.partition("#")
                  pkg_name, pkg_version = spec.strip().lower().split("==", 1)
                  match = re.search(r"过期日[：:]\s*(\d{4}-\d{2}-\d{2})", comment)
                  exempt[(pkg_name, pkg_version)] = (
                      match.group(1) if match else None,
                      line_no,
                  )
              return exempt

          def osv_fetch(vuln_id, timeout=10):
              """按漏洞 ID 查 OSV 详情；4xx 为确定性结果直接返回 None，网络/5xx 重试 1 次。"""
              url = f"{OSV_BASE}/v1/vulns/{vuln_id}"
              for _ in (1, 2):
                  try:
                      with urllib.request.urlopen(url, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      # HTTPError 是 URLError 子类，须先捕获；404 等 4xx 重试无意义
                      if 400 <= exc.code < 500:
                          return None
                      continue
                  except (urllib.error.URLError, TimeoutError, OSError, ValueError):
                      continue
              return None

          def classify(vuln_id, aliases):
              """返回 (严重级, 定级来源ID)；优先查本ID，其次别名中的 GHSA，均失败归 UNKNOWN。"""
              candidates = [vuln_id]
              candidates.extend(
                  alias for alias in aliases
                  if alias.startswith("GHSA-") and alias != vuln_id
              )
              for candidate in candidates:
                  detail = osv_fetch(candidate)
                  if not detail:
                      continue
                  severity = str(
                      (detail.get("database_specific") or {}).get("severity") or ""
                  ).upper()
                  if severity:
                      return severity, candidate
              return "UNKNOWN", vuln_id

          if not AUDIT_JSON.exists():
              print("::error::pip-audit JSON 报告不存在，无法执行分级门禁", file=sys.stderr)
              sys.exit(2)

          report = json.loads(AUDIT_JSON.read_text(encoding="utf-8"))
          exempt = parse_allowlist(ALLOW_LIST)
          today = datetime.date.today()
          blocking = []
          warned = []
          exempted = []
          severity_cache = {}

          for dep in report.get("dependencies", []):
              # 解析失败的依赖只有 name/skip_reason，无版本无漏洞，直接跳过
              if dep.get("skip_reason"):
                  continue
              key = (str(dep.get("name", "")).lower(), str(dep.get("version", "")))
              vulns = dep.get("vulns") or []
              if not vulns:
                  continue
              if key in exempt:
                  expiry, line_no = exempt[key]
                  if expiry is None:
                      # fail-closed：豁免清单条目缺少过期日，不享受豁免，按未豁免高危阻断
                      blocking.append(
                          f"{key[0]}=={key[1]} allowlist 第 {line_no} 行缺少过期日，"
                          f"按 fail-closed 处理（仍有 {len(vulns)} 项漏洞记录）"
                      )
                  elif datetime.date.fromisoformat(expiry) < today:
                      blocking.append(
                          f"{key[0]}=={key[1]} 豁免已于 {expiry} 过期"
                          f"（allowlist 第 {line_no} 行），仍有 {len(vulns)} 项漏洞未处理"
                      )
                  else:
                      exempted.append(
                          f"{key[0]}=={key[1]}（过期日 {expiry}，"
                          f"{len(vulns)} 项漏洞记录）"
                      )
                  continue
              for vuln in vulns:
                  vuln_id = str(vuln.get("id", "UNKNOWN-ID"))
                  aliases = set(vuln.get("aliases") or [])
                  # PYSEC/GHSA 互为镜像时漏洞集合相同，按 {id}∪aliases 去重避免重复定级
                  dedup_key = frozenset({vuln_id} | aliases)
                  if dedup_key in severity_cache:
                      severity, source_id = severity_cache[dedup_key]
                  else:
                      severity, source_id = classify(vuln_id, aliases)
                      severity_cache[dedup_key] = (severity, source_id)
                  source_note = "" if source_id == vuln_id else f"（按别名 {source_id} 定级）"
                  label = f"{key[0]}=={key[1]} {vuln_id} severity={severity}{source_note}"
                  if severity in BLOCK_LEVELS:
                      blocking.append(label)
                  else:
                      warned.append(label)

          for item in exempted:
              print(f"::warning::命中豁免清单，跳过：{item}")
          for item in warned:
              print(f"::warning::中低危漏洞仅告警不阻断：{item}")

          if blocking:
              print("::error::pip-audit 发现未豁免高危（或无法定级）漏洞：", file=sys.stderr)
              for item in blocking:
                  print(f"::error::  - {item}", file=sys.stderr)
              sys.exit(1)

          print(
              f"pip-audit 分级门禁通过：豁免 {len(exempted)} 个包，"
              f"中低危告警 {len(warned)} 项，无未豁免高危项"
          )
          PY

      - name: 探测版本结果汇总（仅 3.12：四关键步骤 outcome 汇总告警，不 exit 1）
        # always() 必不可少：GitHub 在任一步骤失败后默认跳过后续步骤，
        # job 级 continue-on-error 不改变该行为；不加 always() 本步永远 skipped。
        # 3.11 主版本 matrix.experimental=false 短路为 false，本步不执行
        if: ${{ matrix.experimental && always() }}
        shell: bash
        run: |
          # steps.<id>.outcome 反映步骤真实结果（success/failure/cancelled/skipped），
          # 不受 job 级 continue-on-error 影响；探测位失败步骤已在 UI 留红叉+annotation，
          # 本步只把结果收敛成一条聚合 warning，不改变任何退出码（steps context 无 exit code 字段）
          failed_steps=()
          skipped_steps=()
          success_steps=()
          for pair in \
            "ruff=${{ steps.ruff-check.outcome }}" \
            "mypy=${{ steps.mypy-check.outcome }}" \
            "pytest=${{ steps.pytest-run.outcome }}" \
            "pip-audit-gate=${{ steps.pip-audit-gate.outcome }}"; do
            step_name="${pair%%=*}"
            step_outcome="${pair#*=}"
            case "$step_outcome" in
              failure|cancelled) failed_steps+=("${step_name}(${step_outcome})") ;;
              skipped) skipped_steps+=("${step_name}") ;;
              *) success_steps+=("${step_name}") ;;
            esac
          done
          echo "Python 3.12 探测版本四关键步骤 outcome 全量：ruff=${{ steps.ruff-check.outcome }} mypy=${{ steps.mypy-check.outcome }} pytest=${{ steps.pytest-run.outcome }} pip-audit-gate=${{ steps.pip-audit-gate.outcome }}"
          if [ "${#failed_steps[@]}" -gt 0 ]; then
            echo "::warning::Python 3.12 探测版本存在失败步骤（job 级 continue-on-error 不阻断主流水线，但需在版本兼容窗口处理）：${failed_steps[*]}；另 ${skipped_steps[*]:-无} 因前步失败被跳过（非通过）"
          else
            echo "Python 3.12 探测版本：四关键步骤无 failure/cancelled（success: ${success_steps[*]}，skipped: ${skipped_steps[*]:-无}）"
          fi
