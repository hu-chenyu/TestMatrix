<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口适配：宽度跟随设备，初始缩放 1，禁止用户缩放避免布局抖动 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TestMatrix{% endblock %}</title>

    <!-- Bootstrap5 样式（CDN 引入，开发阶段不下载本地库） -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <!-- Bootstrap Icons 图标字体（CDN 引入） -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- 平台全局自定义样式（url_for 生成静态资源地址，禁止硬编码路径） -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    <!-- 子页面级样式扩展点 -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- ===================== 顶部固定导航栏（全站唯一，仅此处定义） ===================== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom">
        <div class="container">
            <!-- 左侧品牌：图标 + 名称，统一指向质量看板（前端入口页） -->
            <a class="navbar-brand" href="{{ url_for('pages.dashboard') }}">
                <i class="bi bi-bug-fill me-1"></i>TestMatrix
            </a>

            <!-- 窄屏折叠按钮（Bootstrap 响应式导航标配） -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#tmMainNavbar"
                    aria-controls="tmMainNavbar"
                    aria-expanded="false"
                    aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="tmMainNavbar">
                <!-- 中部三个页面导航：active_nav 由页面视图渲染时注入，决定当前高亮项 -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}"
                           aria-current="{% if active_nav == 'dashboard' %}page{% endif %}"
                           href="{{ url_for('pages.dashboard') }}">
                            <i class="bi bi-speedometer2 me-1"></i>质量看板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_nav == 'cases' %}active{% endif %}"
                           aria-current="{% if active_nav == 'cases' %}page{% endif %}"
                           href="{{ url_for('pages.cases') }}">
                            <i class="bi bi-list-check me-1"></i>用例管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_nav == 'executions' %}active{% endif %}"
                           aria-current="{% if active_nav == 'executions' %}page{% endif %}"
                           href="{{ url_for('pages.executions') }}">
                            <i class="bi bi-play-circle me-1"></i>执行记录
                        </a>
                    </li>
                </ul>

                <!-- 右侧健康状态占位：Day36+ 由 JS 轮询 /health 后改写颜色与文案 -->
                <span class="health-status d-none d-lg-inline">
                    <i class="bi bi-heart-pulse me-1"></i>服务状态
                </span>
            </div>
        </div>
    </nav>

    <!-- ===================== 主内容区：子页面只填充此 block，不重复 HTML 头 ===================== -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- ===================== 页脚：版本与版权小字，sticky footer 始终贴底 ===================== -->
    <footer class="app-footer py-3 mt-auto">
        <div class="container d-flex justify-content-between align-items-center">
            <span>TestMatrix v1.0.0 · 通用自动化测试效能平台</span>
            <span class="d-none d-md-inline">基于 Flask + Bootstrap5 构建</span>
        </div>
    </footer>

    <!-- Bootstrap5 脚本 bundle（含 Popper，CDN 引入） -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- 公共脚本（工具函数 + toast 封装 + 导航兜底） -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <!-- 统一 API 请求封装（Day36+ 各页面异步获取数据时复用） -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <!-- 子页面级脚本扩展点（ECharts 与页面业务脚本从这里引入） -->
    {% block extra_js %}{% endblock %}
</body>
</html>
